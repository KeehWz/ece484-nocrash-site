<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Noto Sans, Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NoCrash system architecture</title>
  <desc>Onboard sensors feed a reactive Stage 1 driver and a map-based Stage 2 pipeline; both pass through a safety layer before ackermann_mux and the VESC.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="105" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">Onboard sensors</text>
  <g>
    <rect x="20" y="105" width="170" height="54" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="105" y="127" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">2D LiDAR</text>
    <text x="105" y="146" text-anchor="middle" font-size="12.5" fill="#0F6E56">Hokuyo 270°, /scan</text>
    <rect x="20" y="175" width="170" height="54" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="105" y="197" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Wheel odom + IMU</text>
    <text x="105" y="216" text-anchor="middle" font-size="12.5" fill="#0F6E56">VESC, /odom</text>
    <rect x="20" y="245" width="170" height="54" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="105" y="267" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">RGB-D camera</text>
    <text x="105" y="286" text-anchor="middle" font-size="12.5" fill="#0F6E56">optional</text>
  </g>
  <g stroke="#5F5E5A" stroke-width="1.3" fill="none">
    <line x1="190" y1="132" x2="205" y2="132"/>
    <line x1="190" y1="202" x2="205" y2="202"/>
    <line x1="190" y1="272" x2="205" y2="272"/>
    <line x1="205" y1="95" x2="205" y2="290"/>
    <line x1="205" y1="95" x2="222" y2="95" marker-end="url(#ah)"/>
    <line x1="205" y1="290" x2="222" y2="290" marker-end="url(#ah)"/>
  </g>

  <rect x="225" y="40" width="480" height="110" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="242" y="62" font-size="13" font-weight="600" fill="#444441">Stage 1 · reliable finish (reactive, no map)</text>
  <rect x="305" y="78" width="320" height="54" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="465" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Follow-the-Gap driver</text>
  <text x="465" y="119" text-anchor="middle" font-size="12.5" fill="#534AB7">disparity extension, speed from free space</text>

  <rect x="225" y="170" width="480" height="230" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="242" y="192" font-size="13" font-weight="600" fill="#444441">Stage 2 · fast laps (map + localization)</text>
  <rect x="245" y="210" width="210" height="58" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="350" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Track map</text>
  <text x="350" y="254" text-anchor="middle" font-size="12.5" fill="#534AB7">slam_toolbox, offline</text>
  <rect x="475" y="210" width="210" height="58" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="580" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Particle filter</text>
  <text x="580" y="254" text-anchor="middle" font-size="12.5" fill="#534AB7">MCL on map + /scan</text>
  <rect x="245" y="320" width="210" height="58" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="350" y="344" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Raceline + speed</text>
  <text x="350" y="364" text-anchor="middle" font-size="12.5" fill="#534AB7">min. curvature, v ≤ √(μg/κ)</text>
  <rect x="475" y="320" width="210" height="58" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="580" y="344" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Path tracker</text>
  <text x="580" y="364" text-anchor="middle" font-size="12.5" fill="#534AB7">pure pursuit → MPC</text>
  <g stroke="#5F5E5A" stroke-width="1.3" fill="none">
    <line x1="455" y1="239" x2="472" y2="239" marker-end="url(#ah)"/>
    <line x1="350" y1="268" x2="350" y2="317" marker-end="url(#ah)"/>
    <line x1="580" y1="268" x2="580" y2="317" marker-end="url(#ah)"/>
    <line x1="455" y1="349" x2="472" y2="349" marker-end="url(#ah)"/>
    <path d="M625 105 L860 105 L860 147" marker-end="url(#ah)"/>
    <path d="M685 349 L722 349 L722 179 L742 179" marker-end="url(#ah)"/>
    <line x1="860" y1="208" x2="860" y2="247" marker-end="url(#ah)"/>
    <line x1="860" y1="308" x2="860" y2="337" marker-end="url(#ah)"/>
  </g>

  <rect x="745" y="150" width="230" height="58" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4"/>
  <text x="860" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Safety layer</text>
  <text x="860" y="194" text-anchor="middle" font-size="12.5" fill="#993C1D">TTC braking + speed cap</text>
  <rect x="745" y="250" width="230" height="58" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="860" y="274" text-anchor="middle" font-size="15" font-weight="600" fill="#444441">ackermann_mux</text>
  <text x="860" y="294" text-anchor="middle" font-size="12.5" fill="#5F5E5A">joystick override wins</text>
  <rect x="745" y="340" width="230" height="58" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="860" y="364" text-anchor="middle" font-size="15" font-weight="600" fill="#444441">VESC</text>
  <text x="860" y="384" text-anchor="middle" font-size="12.5" fill="#5F5E5A">steering servo + motor</text>

  <rect x="225" y="415" width="480" height="40" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="465" y="440" text-anchor="middle" font-size="12.5" fill="#5F5E5A">Vicon motion capture: ground truth for evaluation only, not used in the race</text>

  <rect x="745" y="416" width="13" height="13" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="765" y="427" font-size="12.5" fill="#444441">Our modules</text>
  <rect x="860" y="416" width="13" height="13" rx="3" fill="#FAECE7" stroke="#993C1D"/>
  <text x="880" y="427" font-size="12.5" fill="#444441">Safety</text>
  <rect x="745" y="441" width="13" height="13" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="765" y="452" font-size="12.5" fill="#444441">Existing course stack</text>
</svg>
